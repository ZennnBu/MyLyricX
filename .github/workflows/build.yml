
name: Build MyLyricX

on:
  workflow_dispatch:
  push:
    paths:
      - "MyLyricX-26.2-Fabric-Updated.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Extract project
        run: |
          mkdir project
          unzip -q MyLyricX-26.2-Fabric-Updated.zip -d project
          PROJECT_DIR=$(dirname "$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          cd "$PROJECT_DIR"
          gradle clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyLyricX-JAR
          path: project/**/build/libs/*.jar
          
