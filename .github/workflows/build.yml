
name: Build MyLyricX

on:
  workflow_dispatch:
  push:
    paths:
      - "**.zip"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.9.1"

      - name: Find and Extract ZIP
        run: |
          mkdir project
          ZIP_FILE=$(find . -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d project

      - name: Find Gradle Project
        run: |
          BUILD_FILE=$(find project -type f \( -name build.gradle -o -name build.gradle.kts \) | head -n 1)

          if [ -z "$BUILD_FILE" ]; then
            echo "ERROR: Gradle build file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$BUILD_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project directory: $PROJECT_DIR"

      - name: Build MyLyricX
        run: |
          cd "$PROJECT_DIR"
          gradle clean build --no-daemon --no-configuration-cache

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: MyLyricX-JAR
          path: project/**/build/libs/*.jar
          if-no-files-found: error
          
